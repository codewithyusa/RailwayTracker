<!DOCTYPE html>
<html>
<head>
    <title>Railway Tracker</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; height: 100vh; font-family: Arial, sans-serif; }
        #map { flex: 2; height: 100vh; }
        #panel { flex: 1; background: #1a1a2e; color: white; overflow-y: auto; padding: 16px; }
        #panel h2 { color: #00d4ff; margin-bottom: 12px; }
        #panel h3 { color: #aaa; font-size: 13px; margin: 16px 0 8px; text-transform: uppercase; }
        input { width:100%; padding:8px; margin-bottom:8px; background:#16213e; color:white; border:1px solid #0f3460; border-radius:4px; }
        .login-btn { width:100%; padding:8px; background:#00d4ff; color:#000; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
        .station-btn { display:block; width:100%; padding:10px; margin-bottom:8px; background:#16213e; border:1px solid #0f3460; border-radius:6px; color:white; cursor:pointer; text-align:left; font-size:14px; }
        .station-btn:hover, .station-btn.active { background:#0f3460; border-color:#00d4ff; }
        .arrival-card { background:#16213e; border-radius:6px; padding:10px; margin-bottom:8px; border-left:3px solid #00d4ff; }
        .arrival-card .train-name { font-weight:bold; font-size:14px; }
        .arrival-card .detail { color:#aaa; font-size:12px; margin-top:4px; }
        .delay { color:#ff6b6b; }
        .ontime { color:#51cf66; }
        .announcement-card { background:#16213e; border-radius:6px; padding:10px; margin-bottom:8px; border-left:3px solid #ffd43b; }
        .announcement-card .title { font-weight:bold; font-size:14px; }
        .announcement-card .body { color:#aaa; font-size:12px; margin-top:4px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="panel">
        <h2>🚆 Railway Tracker</h2>

        <div id="login-section">
            <h3>Login</h3>
            <input id="username" type="text" placeholder="Username" value="admin" />
            <input id="password" type="password" placeholder="Password" value="admin123" />
            <button class="login-btn" onclick="login()">Login</button>
            <p id="login-error" style="color:#ff6b6b;font-size:12px;margin-top:6px"></p>
        </div>

        <div id="main-section" style="display:none">
            <p style="color:#51cf66;font-size:12px;margin-bottom:8px">✅ Logged in as Admin</p>
            <h3>Stations</h3>
            <div id="station-list"></div>
            <h3>Arrivals</h3>
            <div id="arrivals"><p style="color:#aaa;font-size:13px">Select a station</p></div>
            <h3>Announcements</h3>
            <div id="announcements"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        const map = L.map('map').setView([9.0192, 38.7525], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const trainMarkers = {};
        const stationMarkers = {};
        let selectedStation = null;
        let authToken = null;

        const trainIcon = L.divIcon({ html: '🚆', className: '', iconSize: [24, 24] });
        const stationIcon = L.divIcon({ html: '🚉', className: '', iconSize: [24, 24] });

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.token) {
                    authToken = data.token;
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    loadTrains();
                    loadStations();
                } else {
                    document.getElementById('login-error').textContent = 'Invalid credentials';
                }
            })
            .catch(() => {
                document.getElementById('login-error').textContent = 'Login failed';
            });
        }

        function loadTrains() {
            fetch('/api/trains')
                .then(r => r.json())
                .then(trains => {
                    trains.forEach(train => {
                        const marker = L.marker([train.latitude, train.longitude], { icon: trainIcon })
                            .addTo(map)
                            .bindPopup(`<b>${train.name}</b><br>Code: ${train.code}`);
                        trainMarkers[train.id] = marker;
                    });
                });
        }

        function loadStations() {
            fetch('/api/stations')
                .then(r => r.json())
                .then(stations => {
                    const list = document.getElementById('station-list');
                    stations.forEach(station => {
                        const marker = L.marker([station.latitude, station.longitude], { icon: stationIcon })
                            .addTo(map)
                            .bindPopup(`<b>${station.name}</b><br>Code: ${station.code}`);
                        stationMarkers[station.id] = marker;

                        const btn = document.createElement('button');
                        btn.className = 'station-btn';
                        btn.textContent = `🚉 ${station.name} (${station.code})`;
                        btn.onclick = () => selectStation(station, btn);
                        list.appendChild(btn);
                    });

                    // Join all station groups for live announcements
                    stations.forEach(station => {
                        stationConnection.invoke('JoinStationGroup', String(station.id))
                            .catch(err => console.error(err));
                    });
                });
        }

        function selectStation(station, btn) {
            document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedStation = station.id;
            map.setView([station.latitude, station.longitude], 9);

            fetch(`/api/stations/${station.id}/arrivals`)
                .then(r => r.json())
                .then(arrivals => {
                    const div = document.getElementById('arrivals');
                    if (!arrivals || arrivals.length === 0) {
                        div.innerHTML = '<p style="color:#aaa;font-size:13px">No arrivals scheduled</p>';
                        return;
                    }
                    div.innerHTML = arrivals.map(a => `
                        <div class="arrival-card">
                            <div class="train-name">Train #${a.trainId}</div>
                            <div class="detail">Platform ${a.platform}</div>
                            <div class="detail ${a.delayMinutes > 0 ? 'delay' : 'ontime'}">
                                ${a.delayMinutes > 0 ? `Delayed ${a.delayMinutes} min` : 'On Time'}
                            </div>
                        </div>`).join('');
                });

            fetch(`/api/announcements/station/${station.id}`)
                .then(r => r.json())
                .then(announcements => {
                    const div = document.getElementById('announcements');
                    if (!announcements || announcements.length === 0) {
                        div.innerHTML = '<p style="color:#aaa;font-size:13px">No announcements</p>';
                        return;
                    }
                    div.innerHTML = announcements.map(a => `
                        <div class="announcement-card">
                            <div class="title">📢 ${a.title}</div>
                            <div class="body">${a.body}</div>
                            <div class="body" style="color:#555;font-size:11px">${new Date(a.createdAt).toLocaleTimeString()}</div>
                        </div>`).join('');
                });
        }

        // Train SignalR
        const connection = new signalR.HubConnectionBuilder()
            .withUrl('/hubs/trains')
            .withAutomaticReconnect()
            .build();

        connection.on('PositionUpdated', (data) => {
            const marker = trainMarkers[data.trainId];
            if (marker) marker.setLatLng([data.latitude, data.longitude]);
        });

        connection.start().then(async () => {
            const trains = await fetch('/api/trains').then(r => r.json());
            for (const train of trains) {
                await connection.invoke('JoinTrainGroup', String(train.id));
            }
        });

        // Station SignalR — live announcements
        const stationConnection = new signalR.HubConnectionBuilder()
            .withUrl('/hubs/stations')
            .withAutomaticReconnect()
            .build();

        stationConnection.on('NewAnnouncement', (a) => {
            if (a.stationId !== selectedStation) return;
            const div = document.getElementById('announcements');
            const card = `
                <div class="announcement-card">
                    <div class="title">📢 ${a.title}</div>
                    <div class="body">${a.body}</div>
                    <div class="body" style="color:#555;font-size:11px">${new Date(a.createdAt).toLocaleTimeString()}</div>
                </div>`;
            div.innerHTML = card + div.innerHTML;
        });

        stationConnection.start();
    </script>
</body>
</html>
