<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Addis Ababa Light Rail</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0f1e;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
.header{background:#111827;border-bottom:1px solid #1e293b;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-title{font-size:16px;font-weight:600;color:#fff}
.header-sub{font-size:11px;color:#64748b;margin-top:2px}
.clock{font-size:20px;font-weight:500;color:#fbbf24;font-variant-numeric:tabular-nums}
.tabs{display:flex;background:#0f172a;border-bottom:1px solid #1e293b;flex-shrink:0}
.tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border-bottom:3px solid transparent;transition:all .2s}
.tab.active-green{color:#4ade80;border-color:#4ade80;background:#0a1f12}
.tab.active-blue{color:#60a5fa;border-color:#60a5fa;background:#0a1525}
.tab.active-common{color:#f87171;border-color:#f87171;background:#1f0a0a}
.tab:hover:not(.active-green):not(.active-blue):not(.active-common){color:#cbd5e1;background:#1e293b}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:#0f172a;border-right:1px solid #1e293b;overflow-y:auto;flex-shrink:0}
.station-btn{width:100%;padding:9px 12px;background:none;border:none;border-bottom:1px solid #1e293b;color:#94a3b8;font-size:12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.station-btn:hover{background:#1e293b;color:#e2e8f0}
.station-btn.active{background:#1e293b;color:#fff;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.map-panel{flex:1;position:relative}
#map{width:100%;height:100%}
.info-panel{width:280px;background:#0f172a;border-left:1px solid #1e293b;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.info-header{padding:12px 14px;border-bottom:1px solid #1e293b;background:#111827}
.info-station{font-size:14px;font-weight:600;color:#fff}
.info-line{font-size:11px;color:#64748b;margin-top:2px}
.section-title{font-size:10px;font-weight:500;letter-spacing:1px;color:#475569;text-transform:uppercase;padding:10px 14px 4px}
.departure-card{margin:0 10px 6px;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:10px 12px}
.dep-dest{font-size:13px;font-weight:500;color:#e2e8f0}
.dep-via{font-size:11px;color:#64748b;margin-top:2px}
.dep-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dep-time{font-size:13px;font-weight:500;color:#fbbf24}
.dep-status{font-size:11px;font-weight:500}
.status-on{color:#4ade80}
.status-delay{color:#fb923c}
.announce-card{margin:0 10px 6px;background:#1a1000;border:1px solid #78350f;border-radius:8px;padding:10px 12px}
.announce-title{font-size:12px;font-weight:500;color:#fbbf24}
.announce-body{font-size:11px;color:#d97706;margin-top:3px}
.no-data{padding:16px 14px;font-size:12px;color:#475569;text-align:center}
.train-marker{background:transparent;border:none}
.legend{position:absolute;bottom:20px;left:10px;background:#111827cc;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;z-index:1000;font-size:11px}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:#94a3b8}
.legend-item:last-child{margin-bottom:0}
.legend-line{width:20px;height:3px;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <div class="header-title">&#x1F68A; Addis Ababa Light Rail</div>
      <div class="header-sub">Ethiopian Railways Corporation &middot; Live Passenger Display</div>
    </div>
  </div>
  <div class="clock" id="clk">--:--:--</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="map-panel">
    <div id="map"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-line" style="background:#4ade80"></div>Green Line</div>
      <div class="legend-item"><div class="legend-line" style="background:#60a5fa"></div>Blue Line</div>
      <div class="legend-item"><div class="legend-line" style="background:#f87171"></div>Common Section</div>
    </div>
  </div>
  <div class="info-panel" id="info-panel">
    <div class="no-data">Select a station to see departures</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = ['#4ade80', '#60a5fa', '#f87171'];
const TABS   = ['active-green', 'active-blue', 'active-common'];
const EMOJIS = ['\u{1F7E2}', '\u{1F535}', '\u{1F534}'];

const LINE_COLORS = {};
const LINE_TABS   = {};
const LINE_EMOJIS = {};

let lines = [], currentLine = null, selectedStation = null;
let map, stationMarkers = {}, trainMarkers = [], polylines = [];

function tick() {
  const n = new Date();
  document.getElementById('clk').textContent =
    String(n.getHours()).padStart(2,'0') + ':' +
    String(n.getMinutes()).padStart(2,'0') + ':' +
    String(n.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

map = L.map('map', { center: [9.01, 38.76], zoom: 13 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

async function loadLines() {
  const res = await fetch('/api/lines');
  lines = await res.json();
  lines.forEach((l, i) => {
    LINE_COLORS[l.id] = COLORS[i] || '#ffffff';
    LINE_TABS[l.id]   = TABS[i]   || 'active-green';
    LINE_EMOJIS[l.id] = EMOJIS[i] || '\u{1F68A}';
  });
  currentLine = lines[0]?.id ?? null;
  renderTabs();
  renderSidebar();
  renderMap();
}

async function loadTrains() {
  try {
    const res = await fetch('/api/trains');
    const trains = await res.json();
    trainMarkers.forEach(m => map.removeLayer(m));
    trainMarkers = [];
    trains.filter(t => t.isActive).forEach(t => {
      const color = LINE_COLORS[t.lineId] || '#fff';
      const icon = L.divIcon({
        className: 'train-marker',
        html: '<div style="background:' + color + ';width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px ' + color + '"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7]
      });
      const m = L.marker([t.latitude, t.longitude], { icon })
        .bindPopup('<b>' + t.code + '</b> &mdash; ' + t.name + '<br>Status: ' + (['On Time','Delayed','Cancelled','Arrived'][t.status] || t.status));
      m.addTo(map);
      trainMarkers.push(m);
    });
  } catch {}
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = lines.map(l =>
    '<div class="tab ' + (l.id === currentLine ? LINE_TABS[l.id] : '') + '" onclick="switchLine(' + l.id + ')">' +
    LINE_EMOJIS[l.id] + ' ' + l.name + '</div>'
  ).join('');
}

function renderSidebar() {
  const line = lines.find(l => l.id === currentLine);
  if (!line) return;
  const color = LINE_COLORS[currentLine];
  document.getElementById('sidebar').innerHTML = line.stations.map(s =>
    '<button class="station-btn ' + (selectedStation?.id === s.id ? 'active' : '') + '" onclick="selectStation(' + s.id + ')">' +
    '<div class="dot" style="background:' + color + '"></div>' + s.name + '</button>'
  ).join('');
}

function renderMap() {
  polylines.forEach(p => map.removeLayer(p));
  polylines = [];
  Object.values(stationMarkers).forEach(m => map.removeLayer(m));
  stationMarkers = {};

  lines.forEach(line => {
    const color = LINE_COLORS[line.id];
    const coords = line.stations.map(s => [s.latitude, s.longitude]);
    if (coords.length > 1)
      polylines.push(L.polyline(coords, { color, weight: 4, opacity: 0.8 }).addTo(map));
    line.stations.forEach(s => {
      const marker = L.circleMarker([s.latitude, s.longitude], {
        radius: 6, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 1
      }).bindTooltip(s.name, { permanent: false, direction: 'top' })
        .on('click', () => { switchLine(line.id); selectStation(s.id); });
      marker.addTo(map);
      stationMarkers[s.id] = marker;
    });
  });
}

function switchLine(lineId) {
  currentLine = lineId;
  selectedStation = null;
  renderTabs();
  renderSidebar();
  document.getElementById('info-panel').innerHTML = '<div class="no-data">Select a station to see departures</div>';
  const line = lines.find(l => l.id === lineId);
  if (line?.stations?.length) map.setView([line.stations[0].latitude, line.stations[0].longitude], 14);
}

async function selectStation(stationId) {
  for (const l of lines) {
    const found = l.stations.find(s => s.id === stationId);
    if (found) { currentLine = l.id; selectedStation = found; break; }
  }
  renderTabs();
  renderSidebar();
  if (selectedStation) map.setView([selectedStation.latitude, selectedStation.longitude], 15);

  let arrivals = [], announcements = [];
  try { const r = await fetch('/api/stations/' + stationId + '/arrivals');     if (r.ok) arrivals     = await r.json(); } catch {}
  try { const r = await fetch('/api/announcements/station/' + stationId);      if (r.ok) announcements = await r.json(); } catch {}
  try {
    const r = await fetch('/api/announcements');
    if (r.ok) { const all = await r.json(); announcements = [...announcements, ...all.filter(a => !a.stationId)]; }
  } catch {}
  renderInfoPanel(arrivals, announcements);
}

function renderInfoPanel(arrivals, announcements) {
  const line  = lines.find(l => l.id === currentLine);
  const color = LINE_COLORS[currentLine];

  let html = '<div class="info-header">' +
    '<div class="info-station">' + (selectedStation?.name || 'Station') + '</div>' +
    '<div class="info-line" style="color:' + color + '">' + (line?.name || '') + ' &middot; ' + line?.terminusA + ' &harr; ' + line?.terminusB + '</div>' +
    '</div><div class="section-title">Departures</div>';

  if (arrivals.length === 0) {
    [{ dest: line?.terminusB, mins: 3,  delay: false },
     { dest: line?.terminusB, mins: 18, delay: false },
     { dest: line?.terminusA, mins: 7,  delay: true  },
     { dest: line?.terminusA, mins: 22, delay: false }].forEach(d => {
      html += '<div class="departure-card">' +
        '<div class="dep-dest">' + d.dest + '</div>' +
        '<div class="dep-via">via Common Section</div>' +
        '<div class="dep-row"><div class="dep-time">+' + d.mins + ' min</div>' +
        '<div class="dep-status ' + (d.delay ? 'status-delay' : 'status-on') + '">' + (d.delay ? 'Delayed' : 'On time') + '</div></div></div>';
    });
  } else {
    arrivals.forEach(a => {
      const mins = Math.max(0, Math.round((new Date(a.scheduledTime) - new Date()) / 60000));
      html += '<div class="departure-card">' +
        '<div class="dep-dest">Train #' + a.trainId + '</div>' +
        '<div class="dep-via">Platform ' + a.platform + '</div>' +
        '<div class="dep-row"><div class="dep-time">+' + mins + ' min</div>' +
        '<div class="dep-status ' + (a.delayMinutes > 0 ? 'status-delay' : 'status-on') + '">' + (a.delayMinutes > 0 ? 'Delayed ' + a.delayMinutes + 'm' : 'On time') + '</div></div></div>';
    });
  }

  if (announcements.length > 0) {
    html += '<div class="section-title">Announcements</div>';
    announcements.forEach(a => {
      html += '<div class="announce-card">' +
        '<div class="announce-title">&#x1F4E2; ' + a.title + '</div>' +
        '<div class="announce-body">' + a.body + '</div></div>';
    });
  }

  document.getElementById('info-panel').innerHTML = html;
}

loadLines();
loadTrains();
setInterval(loadTrains, 30000);
</script>
</body>
</html>
