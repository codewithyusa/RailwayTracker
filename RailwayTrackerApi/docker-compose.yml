 
services:
  api:
    build:
      context: .
      dockerfile: RailwayTracker.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=railwaytracker;Username=postgres;Password=postgres
      - Jwt__Key=YourSuperSecretKeyHereMakeItLong32Chars!
      - Jwt__Issuer=RailwayTrackerAPI
      - Jwt__Audience=RailwayTrackerClient
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: railwaytracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: